version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: braseq_postgres_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-braseqWeb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema_postgres.sql:/docker-entrypoint-initdb.d/init.sql

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: braseq_web_app
    restart: always
    ports:
      - "80:80"
    env_file:
      - .env
    volumes:
      - .:/var/www/html
    depends_on:
      - db

volumes:
  postgres_data:
